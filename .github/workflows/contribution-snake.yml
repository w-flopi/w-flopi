name: Contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/contribution-snake.yml']

permissions: {}

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Generate Platane/snk SVGs
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light
            dist/snake-dark.svg?palette=github-dark
      - name: Pass SVGs to publishing job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: contribution-snake
          path: dist/*.svg
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download SVGs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: contribution-snake
          path: dist
      - name: Publish only to snake-output
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git init --initial-branch=snake-output output
          git -C output remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          if git -C output ls-remote --exit-code origin refs/heads/snake-output; then
            git -C output fetch --depth=1 origin refs/heads/snake-output
            git -C output reset --hard FETCH_HEAD
          else
            status=$?
            if [ "$status" -ne 2 ]; then exit "$status"; fi
          fi
          install -m 644 dist/snake.svg dist/snake-dark.svg output/
          git -C output add -- snake.svg snake-dark.svg
          if git -C output diff --cached --quiet; then exit 0; fi
          git -C output -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Refresh contribution snake'
          git -C output push origin HEAD:refs/heads/snake-output
